<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generated Successfully</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .card {
            width: 90%;
            max-width: 420px;
            padding: 35px 25px;
            text-align: center;
            background: #ffffff;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        .success-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #22c55e;
            color: white;
            font-size: 42px;
            font-weight: bold;
            border-radius: 50%;
            box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35);
        }

        h1 {
            color: #222;
            font-size: 26px;
            margin-bottom: 10px;
        }

        .message {
            color: #777;
            font-size: 15px;
            margin-bottom: 25px;
        }

        .qr-container {
            width: 230px;
            height: 230px;
            margin: 0 auto 25px;
            padding: 12px;
            background: white;
            border-radius: 15px;
            border: 2px solid #eeeeee;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .qr-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .download-btn {
            display: inline-block;
            width: 100%;
            padding: 14px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        .download-btn:hover {
            background: #5568d8;
            transform: translateY(-2px);
        }

        .footer {
            margin-top: 20px;
            color: #aaa;
            font-size: 12px;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="success-icon">✓</div>

        <h1>QR Code Generated!</h1>

        <p class="message">
            Your QR code has been generated successfully.
        </p>

        <div class="qr-container">
            <!-- Replace qr-code.png with your QR image -->
            <img src="qr-code.png" alt="Generated QR Code">
        </div>

        <a href="qr-code.png" download="QR-Code.png" class="download-btn">
            Download QR Code
        </a>

        <div class="footer">
            Scan the QR code using your phone camera
        </div>

    </div>

</body>
</html>
