<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generated Successfully</title><style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .card {
        width: 90%;
        max-width: 420px;
        padding: 40px 25px;
        text-align: center;
        background: #fff;
        border-radius: 25px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .success-icon {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #22c55e;
        color: white;
        font-size: 45px;
        font-weight: bold;
        border-radius: 50%;
        box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35);
    }

    h1 {
        color: #222;
        font-size: 27px;
        margin-bottom: 12px;
    }

    p {
        color: #777;
        font-size: 16px;
        line-height: 1.5;
    }

    .status {
        margin-top: 25px;
        padding: 14px;
        background: #f0fdf4;
        color: #16a34a;
        border-radius: 12px;
        font-weight: bold;
    }
</style>

</head><body><div class="card">

    <div class="success-icon">
        ✓
    </div>

    <h1>QR Code Generated Successfully!</h1>

    <p>
        Your QR code has been generated successfully.
    </p>

    <div class="status">
        Ready to use
    </div>

</div>

</body>
</html>
